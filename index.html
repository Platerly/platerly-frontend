<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Recipzee — Allergy-Safe Recipe Social Network</title>
    <link rel="canonical" href="https://www.recipzee.com/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO basics -->
    <meta
      name="description"
      content="Recipzee is the allergy-aware recipe network — from nickel and gluten to dairy and shellfish. Discover safe recipes, share your own, and cook with confidence."
    />
    <meta
      name="keywords"
      content="Recipzee, allergy-safe recipes, halal recipes, vegan cooking, gluten-free meals, dairy-free recipes, healthy food, low-nickel diet, recipe sharing, cooking community, meal inspiration, inclusive cooking"
    />
    <meta name="author" content="Recipzee Inc." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <!-- Dark shell to avoid bright flash on load -->
    <meta name="theme-color" content="#0B1F1F" />

    <!-- Social / Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recipzee" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Recipzee — Allergy-Safe Recipe Social Network"
    />
    <meta
      property="og:description"
      content="Recipzee is the allergy-aware recipe network — from nickel and gluten to dairy and shellfish. Discover safe recipes, share your own, and cook with confidence."
    />
    <meta property="og:url" content="https://www.recipzee.com/" />
    <meta property="og:image" content="https://www.recipzee.com/og-preview.png" />
    <meta
      property="og:image:secure_url"
      content="https://www.recipzee.com/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Recipzee — Share, Remix, Explore healthy, allergy-safe recipes"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Recipzee — Allergy-Safe Recipe Social Network"
    />
    <meta
      name="twitter:description"
      content="Recipzee is the allergy-aware recipe network — from nickel and gluten to dairy and shellfish. Discover safe recipes, share your own, and cook with confidence."
    />
    <meta name="twitter:image" content="https://www.recipzee.com/og-preview.png" />
    <meta name="twitter:url" content="https://www.recipzee.com/" />
    <meta name="twitter:domain" content="recipzee.com" />
    <meta name="twitter:site" content="@recipzee" />

    <!-- Minimal structured data (helps Google understand brand) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Recipzee",
        "url": "https://www.recipzee.com/",
        "logo": "https://www.recipzee.com/logo.png",
        "sameAs": []
      }
    </script>

    <!-- Prevent FOUC on dark background (matches app shell) -->
    <style>
      :root { color-scheme: dark; }
      html, body { background: #0B1F1F; }
    </style>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1603724644392689');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Meta Pixel noscript fallback -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1603724644392689&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
