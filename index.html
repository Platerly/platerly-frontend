<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Platerly — Allergy-Safe Recipe Social Network</title>
    <link rel="canonical" href="https://www.platerly.com/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- Optional: iOS home screen icon -->
    <!-- <link rel="apple-touch-icon" href="/logo.png" /> -->

    <!-- SEO basics -->
    <meta name="description" content="Welcome to Platerly — the recipe network for the future. Allergy-aware, halal by design, and powered by intelligent ingredients. Built for everyone, everywhere.">
    <meta name="keywords" content="Platerly, allergy-safe recipes, halal recipes, vegan cooking, gluten-free meals, dairy-free recipes, healthy food, low-nickel diet, recipe sharing, cooking community, meal inspiration, inclusive cooking">
    <meta name="author" content="Platerly Inc.">
    <meta name="robots" content="index,follow">
    <!-- Brand theme: use dark shell to avoid bright flash on load -->
    <meta name="theme-color" content="#0B1F1F" />

    <!-- Social / Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Platerly">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Platerly — Allergy-Safe Recipe Social Network">
    <meta property="og:description" content="Welcome to Platerly — the recipe network for the future. Allergy-aware, halal by design, and powered by intelligent ingredients. Built for everyone, everywhere.">
    <meta property="og:url" content="https://www.platerly.com/">
    <meta property="og:image" content="https://www.platerly.com/og-preview.png">
    <meta property="og:image:alt" content="Platerly — Share, Remix, Explore healthy, allergy-safe recipes">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Platerly — Allergy-Safe Recipe Social Network">
    <meta name="twitter:description" content="Welcome to Platerly — the recipe network for the future. Allergy-aware, halal by design, and powered by intelligent ingredients. Built for everyone, everywhere.">
    <meta name="twitter:image" content="https://www.platerly.com/og-preview.png">
    <meta name="twitter:site" content="@platerlyinc">

    <!-- Minimal structured data (helps Google understand brand) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Platerly",
      "url": "https://www.platerly.com/",
      "logo": "https://www.platerly.com/logo.png",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
